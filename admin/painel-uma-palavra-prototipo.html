<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uma Palavra de Deus por Dia — Painel</title>
<style>
:root{--bg:#111114;--panel:#1b191d;--panel2:#242126;--text:#f5f1f4;--muted:#aaa1aa;--wine:#8f173e;--wine2:#b32652;--gold:#d8b66a;--line:#38323a;--green:#5dbb83;--red:#e16d72;--yellow:#d8b66a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:24px 18px;border-bottom:1px solid var(--line);background:linear-gradient(110deg,#25151d,#171519)}
.wrap{max-width:980px;margin:auto;padding:20px}
h1{margin:0;font-size:22px}header p{margin:6px 0 0;color:var(--muted)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:980px;margin:auto}
.brand{display:flex;align-items:center;gap:12px}.mark{width:40px;height:40px;border-radius:12px;background:var(--wine);display:grid;place-items:center;color:var(--gold);font-weight:800;font-size:19px}
.admin{color:var(--gold);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat-label{color:var(--muted);font-size:13px}.stat-number{font-size:28px;font-weight:750;margin-top:4px}
h2{font-size:17px;margin:0 0 14px}
.generate-row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}
label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
select,input{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px 12px;font:inherit}
select{min-width:150px}input{width:100%}
button{background:var(--wine2);color:white;border:0;border-radius:9px;padding:11px 16px;font:inherit;font-weight:650;cursor:pointer}
button:hover{filter:brightness(1.12)}button.secondary{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
button.small{padding:7px 10px;font-size:13px}
.gold{color:var(--gold)}
.search{margin:16px 0}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--muted);font-weight:600}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.4px}
.badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;background:#29252b}
.badge.active{color:var(--green);background:#173324}.badge.suspended{color:var(--yellow);background:#342b18}.badge.expired{color:var(--red);background:#351e22}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:26px}
.notice{color:var(--muted);font-size:12px;margin-top:12px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#29242b;border:1px solid var(--line);padding:12px 16px;border-radius:10px;display:none}
@media(max-width:650px){.wrap{padding:14px}.stats{grid-template-columns:1fr 1fr}.stats .card:last-child{grid-column:span 2}.topline{align-items:flex-start}.admin{display:none}table,tbody,tr,td{display:block}thead{display:none}tr{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:10px;background:var(--panel)}td{border:0;padding:6px 4px}td::before{content:attr(data-label);display:block;color:var(--muted);font-size:11px;margin-bottom:2px}.actions{margin-top:5px}}
</style>
</head>
<body>
<header><div class="topline">
<div class="brand"><div class="mark">✝</div><div><h1>Uma Palavra de Deus por Dia</h1><p>Painel administrativo</p></div></div>
<div class="admin">Maurício Francisco</div>
</div></header>
<main class="wrap">
<section class="stats">
<div class="card"><div class="stat-label">Total de códigos</div><div class="stat-number" id="total">0</div></div>
<div class="card"><div class="stat-label">Ativos</div><div class="stat-number gold" id="active">0</div></div>
<div class="card"><div class="stat-label">Suspensos / expirados</div><div class="stat-number" id="inactive">0</div></div>
</section>
<section class="card">
<h2>Gerar códigos</h2>
<div class="generate-row">
<div><label for="qty">Quantidade</label><select id="qty"><option>1</option><option>5</option><option>10</option><option>25</option></select></div>
<div><label for="duration">Validade</label><select id="duration"><option value="30">30 dias</option><option value="90">90 dias</option><option value="180">180 dias</option><option value="365">365 dias</option></select></div>
<button id="generate">＋ Gerar código</button>
</div>
<p class="notice">Protótipo: os dados ficam guardados apenas neste navegador. Ainda não está ligado ao Appwrite.</p>
</section>
<section class="card" style="margin-top:16px">
<h2>Consultar códigos</h2>
<div class="search"><label for="search">Pesquisar código</label><input id="search" placeholder="Escreve um código para pesquisar…"></div>
<div id="tableArea"></div>
</section>
</main>
<div class="toast" id="toast"></div>
<script>
const STORE='palavraDeusPainelPrototypeV1';
let codes=JSON.parse(localStorage.getItem(STORE)||'[]');
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(STORE,JSON.stringify(codes));render()}
function status(c){if(c.estado==='Suspenso')return 'Suspenso';return new Date(c.validade)<new Date()?'Expirado':'Ativo'}
function makeCode(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<8;i++)s+=chars[Math.floor(Math.random()*chars.length)];return s}
function date(d){return new Date(d).toLocaleDateString('pt-PT')}
function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2300)}
$('generate').onclick=()=>{
 const n=Number($('qty').value),days=Number($('duration').value);
 for(let i=0;i<n;i++){let c;do{c=makeCode()}while(codes.some(x=>x.codigo===c));
 codes.unshift({codigo:c,criado:new Date().toISOString(),validade:new Date(Date.now()+days*86400000).toISOString(),duracao:days,estado:'Ativo'});
 }
 save();toast(n===1?'Código gerado!':`${n} códigos gerados!`);
};
$('search').oninput=render;
function render(){
 const filtered=codes.filter(c=>c.codigo.toLowerCase().includes($('search').value.trim().toLowerCase()));
 const active=codes.filter(c=>status(c)==='Ativo').length;
 $('total').textContent=codes.length;$('active').textContent=active;$('inactive').textContent=codes.length-active;
 if(!filtered.length){$('tableArea').innerHTML='<div class="empty">'+(codes.length?'Nenhum código encontrado.':'Ainda não existem códigos. Gera o primeiro acima.')+'</div>';return}
 $('tableArea').innerHTML='<table><thead><tr><th>Código</th><th>Validade</th><th>Duração</th><th>Estado</th><th>Acções</th></tr></thead><tbody>'+filtered.map(c=>{
 const s=status(c),cls=s==='Ativo'?'active':s==='Suspenso'?'suspended':'expired';
 return `<tr><td data-label="Código" class="code">${c.codigo}</td><td data-label="Validade">${date(c.validade)}</td><td data-label="Duração">${c.duracao} dias</td><td data-label="Estado"><span class="badge ${cls}">${s}</span></td><td data-label="Acções"><div class="actions">${s==='Ativo'?`<button class="small secondary" onclick="suspend('${c.codigo}')">Suspender</button>`:s==='Suspenso'?`<button class="small secondary" onclick="reactivate('${c.codigo}')">Reativar</button>`:''}<button class="small secondary" onclick="renew('${c.codigo}')">Renovar 30 dias</button><button class="small secondary" onclick="copyCode('${c.codigo}')">Copiar</button></div></td></tr>`;
 }).join('')+'</tbody></table>';
}
window.suspend=code=>{const c=codes.find(x=>x.codigo===code);if(c){c.estado='Suspenso';save();toast('Código suspenso.')}};
window.reactivate=code=>{const c=codes.find(x=>x.codigo===code);if(c){c.estado='Ativo';save();toast('Código reativado.')}};
window.renew=code=>{const c=codes.find(x=>x.codigo===code);if(c){c.validade=new Date(Date.now()+30*86400000).toISOString();c.duracao=30;c.estado='Ativo';save();toast('Renovado por 30 dias.')}};
window.copyCode=code=>navigator.clipboard?.writeText(code).then(()=>toast('Código copiado!')).catch(()=>toast('Não foi possível copiar.'));
render();
</script>
</body>
</html>
