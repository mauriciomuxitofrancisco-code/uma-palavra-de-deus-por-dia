<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uma Palavra de Deus por Dia</title>
  <style>
    body {
      margin: 0;
      padding: 25px;
      font-family: Arial, sans-serif;
      background: #f5f0e6;
      color: #333;
      text-align: center;
    }
    .container {
      max-width: 450px;
      margin: 60px auto;
      padding: 25px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 3px 15px #0002;
    }
    h1 { color: #76552d; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #ccc; }
    button {
      border: none;
      background: #76552d;
      color: white;
      cursor: pointer;
    }
    #mensagem { margin-top: 18px; }
    #conteudo { display: none; }
  </style>
</head>
<body>

<div class="container">
  <h1>Uma Palavra de Deus por Dia</h1>
  <p>Introduz o código da tua pulseira para entrar.</p>

  <div id="entrada">
    <input id="codigo" placeholder="Código da pulseira">
    <button onclick="verificarCodigo()">Entrar</button>
    <p id="mensagem"></p>
  </div>

  <div id="conteudo">
    <h2>Bem-vindo!</h2>
    <p>O teu acesso está ativo.</p>
    <p>A tua palavra de Deus por dia estará disponível aqui.</p>
    <button onclick="sair()">Sair</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://okcmbnucjzkeiduivsny.supabase.co";
const SUPABASE_KEY = "sb_publishable_7F_7S5UWTRO-l2tDB-PLeQ__J28PZ6v";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function verificarCodigo() {
  const campo = document.getElementById("codigo");
  const mensagem = document.getElementById("mensagem");
  const codigo = campo.value.trim();

  if (!codigo) {
    mensagem.textContent = "Introduz o código da pulseira.";
    return;
  }

  mensagem.textContent = "A verificar o código...";

  try {
    const { data, error } = await db.rpc(
      "validar_pulseira",
      { p_codigo: codigo }
    );

    if (error) throw error;

    if (data === true) {
      localStorage.setItem("codigo_pulseira", codigo);
      mostrarConteudo();
    } else {
      mensagem.textContent =
        "Código inválido, suspenso ou com a validade terminada.";
    }
  } catch (erro) {
    mensagem.textContent =
      "Não foi possível verificar. Tenta novamente.";
    console.error(erro);
  }
}

function mostrarConteudo() {
  document.getElementById("entrada").style.display = "none";
  document.getElementById("conteudo").style.display = "block";
}

function sair() {
  localStorage.removeItem("codigo_pulseira");
  location.reload();
}

async function verificarAcessoGuardado() {
  const codigo = localStorage.getItem("codigo_pulseira");

  if (!codigo) return;

  const { data, error } = await db.rpc(
    "validar_pulseira",
    { p_codigo: codigo }
  );

  if (!error && data === true) {
    mostrarConteudo();
  } else {
    localStorage.removeItem("codigo_pulseira");
  }
}

verificarAcessoGuardado();
</script>

</body>
</html>
