
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#008CBA">
  <title>Uma Palavra de Deus por Dia</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #008CBA;
      color: #123047;
      text-align: center;
      min-height: 100vh;
    }

    .container {
      max-width: 520px;
      margin: 45px auto;
      padding: 28px 22px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 5px 22px #003b5533;
    }

    h1 {
      color: #006F96;
      font-size: 27px;
      line-height: 1.3;
    }

    h2 {
      color: #006F96;
    }

    p {
      line-height: 1.7;
    }

    input, button {
      width: 100%;
      padding: 15px;
      margin-top: 13px;
      border-radius: 9px;
      font-size: 16px;
    }

    input {
      border: 1px solid #b5dce8;
      outline-color: #008CBA;
    }

    button {
      border: none;
      background: #008CBA;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #006F96;
    }

    #mensagem {
      margin-top: 18px;
      color: #a52a2a;
    }

    #conteudo {
      display: none;
      text-align: left;
    }

    #conteudo h2,
    #conteudo h3 {
      color: #006F96;
    }

    #conteudo button {
      margin-top: 25px;
    }

    .assinatura {
      margin-top: 28px;
      color: #547080;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="container">

  <div id="entrada">
    <h1>Uma Palavra de Deus por Dia</h1>
    <p>Uma mensagem de fé, esperança e amor para cada dia.</p>
    <p>Introduz o código da tua pulseira para entrar.</p>

    <input
      id="codigo"
      placeholder="Código da pulseira"
      autocomplete="off"
    >

    <button onclick="verificarCodigo()">Entrar</button>

    <p id="mensagem"></p>
  </div>

  <div id="conteudo"></div>

  <p class="assinatura">
    Uma Palavra de Deus por Dia
  </p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Motor das mensagens diárias -->
<script src="./dias.js"></script>

<script>
const SUPABASE_URL = "https://okcmbnucjzkeiduivsny.supabase.co";

const SUPABASE_KEY = "sb_publishable_7F_7S5UWTRO-l2tDBP-LeQ__J28PZ6v";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function verificarCodigo() {
  const campo = document.getElementById("codigo");
  const mensagem = document.getElementById("mensagem");
  const codigo = campo.value.trim();

  if (!codigo) {
    mensagem.textContent = "Introduz o código da pulseira.";
    return;
  }

  mensagem.textContent = "A verificar o código...";

  try {
    const { data, error } = await db.rpc(
      "validar_pulseira",
      { p_codigo: codigo }
    );

    if (error) throw error;

    if (data === true) {
      localStorage.setItem("codigo_pulseira", codigo);
      mostrarConteudo();
    } else {
      mensagem.textContent =
        "Código inválido, suspenso ou com a validade terminada.";
    }

  } catch (erro) {
    mensagem.textContent =
      "Não foi possível verificar. Tenta novamente.";

    console.error(erro);
  }
}

function mostrarConteudo() {
  document.getElementById("entrada").style.display = "none";

  const area = document.getElementById("conteudo");
  area.style.display = "block";

  if (typeof window.mostrarPalavraDoDia === "function") {
    window.mostrarPalavraDoDia();
  } else {
    area.innerHTML =
      "<p>Não foi possível carregar a Palavra do Dia. Atualiza a página.</p>";
  }

  const botaoSair = document.createElement("button");
  botaoSair.textContent = "Sair";
  botaoSair.onclick = sair;
  area.appendChild(botaoSair);
}

function sair() {
  localStorage.removeItem("codigo_pulseira");
  location.reload();
}

async function verificarAcessoGuardado() {
  const codigo = localStorage.getItem("codigo_pulseira");

  if (!codigo) return;

  try {
    const { data, error } = await db.rpc(
      "validar_pulseira",
      { p_codigo: codigo }
    );

    if (!error && data === true) {
      mostrarConteudo();
    } else {
      localStorage.removeItem("codigo_pulseira");
    }

  } catch (erro) {
    console.error(erro);
  }
}

verificarAcessoGuardado();
</script>

</body>
</html>
