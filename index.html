
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#008CBA">
  <title>Uma Palavra de Deus por Dia</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #008CBA;
      color: #123047;
      text-align: center;
      min-height: 100vh;
    }

    .container {
      max-width: 520px;
      margin: 45px auto;
      padding: 28px 22px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 5px 22px #003b5533;
    }

    h1, h2, h3 { color: #006F96; }

    h1 {
      font-size: 27px;
      line-height: 1.3;
    }

    p { line-height: 1.7; }

    input, button {
      width: 100%;
      padding: 15px;
      margin-top: 13px;
      border-radius: 9px;
      font-size: 16px;
    }

    input {
      border: 1px solid #b5dce8;
      outline-color: #008CBA;
    }

    button {
      border: none;
      background: #008CBA;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: #006F96; }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #mensagem {
      margin-top: 18px;
      color: #a52a2a;
      overflow-wrap: anywhere;
    }

    #conteudo {
      display: none;
      text-align: left;
    }

    #conteudo button { margin-top: 25px; }

    .assinatura {
      margin-top: 28px;
      color: #547080;
      font-size: 13px;
    }
  </style>
</head>

<body>
<div class="container">

  <div id="entrada">
    <h1>Uma Palavra de Deus por Dia</h1>
    <p>Uma mensagem de fé, esperança e amor para cada dia.</p>
    <p>Introduz o código da tua pulseira para entrar.</p>

    <input
      id="codigo"
      placeholder="Código da pulseira"
      autocomplete="off"
      autocapitalize="characters"
    >

    <button id="botaoEntrar" onclick="verificarCodigo()">
      Entrar
    </button>

    <p id="mensagem" role="status"></p>
  </div>

  <div id="conteudo"></div>

  <p class="assinatura">Uma Palavra de Deus por Dia</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./dias.js"></script>

<script>
const SUPABASE_URL =
  "https://okcmbnucjzkeiduivsny.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_7F_7S5UWTRO-l2tDBP-LeQ__J28PZ6v";

let db = null;

try {
  if (!window.supabase || !window.supabase.createClient) {
    throw new Error("A biblioteca do Supabase não foi carregada.");
  }

  db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

} catch (erro) {
  console.error("Erro ao iniciar Supabase:", erro);
}

async function validarCodigo(codigo) {
  if (!db) {
    throw new Error("Não foi possível iniciar a ligação ao Supabase.");
  }

  const resposta = await db.rpc(
    "validar_pulseira",
    { p_codigo: codigo }
  );

  if (resposta.error) {
    console.error("Erro Supabase:", resposta.error);
    throw resposta.error;
  }

  return resposta.data === true;
}

async function verificarCodigo() {
  const campo = document.getElementById("codigo");
  const mensagem = document.getElementById("mensagem");
  const botao = document.getElementById("botaoEntrar");

  const codigo = campo.value.trim().toUpperCase();

  if (!codigo) {
    mensagem.textContent = "Introduz o código da pulseira.";
    return;
  }

  mensagem.textContent = "A verificar o código...";
  botao.disabled = true;

  try {
    const valido = await validarCodigo(codigo);

    if (valido) {
      localStorage.setItem("codigo_pulseira", codigo);
      mensagem.textContent = "";
      mostrarConteudo();
    } else {
      mensagem.textContent =
        "Código inválido, suspenso ou com a validade terminada.";
    }

  } catch (erro) {
    console.error("Falha na validação:", erro);

    mensagem.textContent =
      "Erro de ligação: " +
      (erro.message || erro.details || "Não foi possível contactar o Supabase.");

  } finally {
    botao.disabled = false;
  }
}

function mostrarConteudo() {
  document.getElementById("entrada").style.display = "none";

  const area = document.getElementById("conteudo");
  area.style.display = "block";

  if (typeof window.mostrarPalavraDoDia === "function") {
    window.mostrarPalavraDoDia();
  } else {
    area.innerHTML =
      "<p>Não foi possível carregar a Palavra do Dia. Atualiza a página.</p>";
  }

  if (!document.getElementById("botaoSair")) {
    const botaoSair = document.createElement("button");
    botaoSair.id = "botaoSair";
    botaoSair.textContent = "Sair";
    botaoSair.onclick = sair;
    area.appendChild(botaoSair);
  }
}

function sair() {
  localStorage.removeItem("codigo_pulseira");
  location.reload();
}

async function verificarAcessoGuardado() {
  const codigo = localStorage.getItem("codigo_pulseira");

  if (!codigo) return;

  try {
    const valido = await validarCodigo(codigo);

    if (valido) {
      mostrarConteudo();
    } else {
      localStorage.removeItem("codigo_pulseira");
    }

  } catch (erro) {
    console.error("Erro ao verificar acesso guardado:", erro);
  }
}

verificarAcessoGuardado();
</script>

</body>
</html>
